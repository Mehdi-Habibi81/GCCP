version: '3.8'

services:
  app:
    build: .
    image: gccp_app:latest
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_NAME=gccp
      - DB_USER=root
      - DB_PASS=secret
      - PASSWORD_PEPPER=change-me
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: gccp
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
