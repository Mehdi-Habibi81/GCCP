name: CI / Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, gd, pdo_mysql

      - name: Install Composer deps
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l || true

      - name: Build Docker image (local, not pushed)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: gccp:ci

      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Render secrets not set; skipping Render deploy trigger."
            exit 0
          fi

          echo "Triggering Render deploy for service: $RENDER_SERVICE_ID"

          resp=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}')

          echo "Render deploy API returned HTTP status: $resp"
